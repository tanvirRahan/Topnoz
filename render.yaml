databases:
  - name: topnoz_db
    plan: free
    databaseName: topnoz
    user: topnoz_user

services:
  - type: web
    name: topnoz-web
    env: python
    plan: free
    buildCommand: "./scripts/build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: topnoz_db
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: topnoz.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://topnoz.onrender.com
